<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeHost Info</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Sora:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--g:#0a1128;--g2:#131d3f;--line:#27366b;--a:#ffb703;--t:#eef2ff;--m:#8d9bd0}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(1100px 560px at 50% -8%,#18265a,var(--g));background-color:var(--g);color:var(--t);font-family:'Manrope',system-ui,sans-serif;overflow-x:hidden;line-height:1.6}
h1,h2,.brand{font-family:'Sora','Manrope',sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 5vw;border-bottom:1px solid var(--line)}
header img{height:42px;width:auto;border-radius:8px}
.brand{font-size:1.25rem;font-weight:800}
header .gear{margin-left:auto;color:var(--t);width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%}
header .gear:hover{color:var(--a);border-color:var(--a)}
header .gear svg{width:20px;height:20px}
.hero{padding:9vh 5vw 4vh;max-width:1000px}
.hero h1{font-size:clamp(2.2rem,7vw,4.6rem);line-height:1.08;font-weight:800}
.hero p{margin-top:18px;max-width:60ch;color:#aab7e3;font-size:1.1rem}
section{padding:5vh 0}
section>h2{padding:0 5vw;font-size:1.7rem;margin-bottom:4px}
.empty{padding:20px 5vw;color:var(--m)}
/* 3D carousel */
.scene{perspective:1200px;display:flex;justify-content:center;align-items:center;overflow:hidden}
.sc{width:100%;height:100%;display:flex;justify-content:center;align-items:center;transform-style:preserve-3d}
.ring{position:relative;width:var(--w);height:var(--h);transform-style:preserve-3d;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotateY(-360deg)}}
.card{position:absolute;inset:0;transform-style:preserve-3d}
.front,.bk{position:absolute;inset:0;border-radius:18px;border:1px solid color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 0 34px -10px color-mix(in srgb,var(--c) 50%,transparent);backface-visibility:hidden}
.front{overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 24%,#0c1430),#0a1128 75%)}
.bk{transform:rotateY(180deg);display:grid;place-items:center;overflow:hidden;background:linear-gradient(180deg,#e6e6e6,#d4d4d4)}
.bk img{width:100%;height:auto;display:block;-webkit-mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.bkt{font-family:'Sora',sans-serif;font-weight:800;font-size:1.3rem;letter-spacing:.5px;color:var(--t)}
.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.svc .front img{inset:auto;top:16%;left:50%;width:58%;height:46%;transform:translateX(-50%);object-fit:contain}
.info{position:relative;width:100%;padding:76px 14px 14px;background:linear-gradient(transparent,#0a1128f2 62%);text-align:left}
.svc .info{background:none;text-align:center;padding:0 10px 18px}
.info b{display:block;font-size:1.02rem;line-height:1.25;text-transform:uppercase;letter-spacing:.4px}
.svc .info b{text-transform:none;font-size:1.05rem}
.role{display:inline-block;background:var(--a);color:var(--g);font-weight:700;font-size:.78rem;padding:3px 10px;border-radius:4px;margin:7px 0 6px}
.view{display:block;text-align:center;border:1px solid var(--a);color:var(--a);padding:6px;border-radius:8px;text-decoration:none;font-weight:700;background:#0a1128aa}
.view:hover{background:var(--a);color:var(--g)}
@media(prefers-reduced-motion:reduce){.ring{animation-duration:120s}}
.map{padding:0 5vw}
.map iframe{width:100%;height:340px;border:1px solid var(--line);border-radius:14px}
.map p{margin-bottom:10px;color:#aab7e3}
.links{padding:0 5vw;display:flex;flex-wrap:wrap;gap:10px}
.links a{color:var(--g);background:var(--a);padding:9px 18px;border-radius:999px;text-decoration:none;font-weight:700}
footer{padding:30px 5vw 90px;color:#7482b8;border-top:1px solid var(--line);margin-top:30px}
.wa{position:fixed;right:18px;bottom:18px;width:60px;height:60px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 6px 20px #0008;z-index:9}
.wa svg{width:34px;height:34px;fill:#fff}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
/* profile */
.back{color:var(--t);border:1px solid var(--line);padding:7px 16px;border-radius:999px;text-decoration:none;font-weight:600}
.back:hover{border-color:var(--a);color:var(--a)}
#profile{display:none}
.pf{display:flex;gap:30px;align-items:center;flex-wrap:wrap;padding:5vh 5vw 2vh}
.pf img{width:min(330px,100%);aspect-ratio:3/4;object-fit:cover;border-radius:20px;border:1px solid var(--line);background:var(--g2)}
.pf h1{font-size:clamp(1.8rem,5vw,3rem);line-height:1.1}
.pad{padding:5vh 5vw}
#profile h2{padding:4vh 5vw 14px;font-size:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;padding:0 5vw}
.tile{background:var(--g2);border:1px solid var(--line);border-radius:16px;padding:22px}
.tile small{color:var(--m);display:block;margin-bottom:6px}
.tile b{font-family:'Sora',sans-serif;font-size:1.35rem}
.tile.tool{border-left:4px solid var(--a);font-weight:700}
.nl{list-style:none;counter-reset:n;padding:0 5vw;max-width:780px}
.nl li{counter-increment:n;display:flex;gap:14px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);font-size:1.1rem}
.nl li::before{content:counter(n)'.';color:var(--a);font-weight:800;min-width:2.2ch;font-family:'Sora',sans-serif}
.nl li span{color:var(--m);min-width:190px}
.nl li b{font-weight:700}
.al{padding-left:26px;margin:8px 0}.al li{padding:3px 0}.al li button{padding:2px 10px;margin:0 0 0 8px}
/* admin */
#admin{display:none;max-width:980px;margin:auto;padding:0 5vw 60px}
.abar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:14px 0;background:#0a1128ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-bottom:6px}
.abar h2{margin-right:auto;display:flex;align-items:center;gap:10px;font-size:1.4rem}
.abar h2::before{content:'';width:10px;height:26px;border-radius:4px;background:var(--a)}
#admin input,#admin select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0d1736;color:var(--t);margin:4px 4px 4px 0;transition:.15s}
#admin input:focus,#admin select:focus{border-color:var(--a);box-shadow:0 0 0 3px #ffb70333;outline:0}
#admin button{font:inherit;padding:9px 16px;border-radius:10px;border:0;background:var(--a);color:#0a1128;font-weight:800;cursor:pointer;margin:4px 4px 4px 0;transition:.15s}
#admin button:hover{transform:translateY(-1px);box-shadow:0 6px 16px #ffb70344}
#admin button:disabled{opacity:.5;cursor:wait;transform:none;box-shadow:none}
#admin button.sec{background:transparent;color:var(--t);border:1px solid var(--line)}
#admin button.del{background:#ff4d5e;color:#fff}
.box{background:linear-gradient(180deg,#14204a,#101a3c);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:8px;transition:.15s}
.box:focus-within{border-color:#ffb70388}
.ah{display:flex;align-items:center;gap:10px;margin:28px 0 4px;font-size:1.15rem;font-weight:800;font-family:'Sora',sans-serif}
.ah span{background:var(--a);color:#0a1128;border-radius:999px;font-size:.78rem;padding:1px 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-radius:10px;transition:.15s;flex-wrap:wrap}
.row:hover{background:#ffb70312;box-shadow:inset 3px 0 var(--a)}
.row img{height:42px;width:42px;object-fit:cover;border-radius:8px;background:var(--g)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--a);color:#0a1128;font-weight:800;padding:10px 20px;border-radius:999px;z-index:20;box-shadow:0 8px 24px #0008}
.toast.err{background:#ff4d5e;color:#fff}
</style>
</head>

let LOGO='';
function ring(el,items,cls=''){
  if(!items.length){el.style.height='auto';el.innerHTML='<p class="empty">Nothing added yet.</p>';return}
  const P=cls==='p',w=P?230:190,h=P?310:250,n=items.length,
  r=Math.max(P?300:260,Math.round(w*1.1/2/Math.tan(Math.PI/Math.max(n,3)))+14),
  pe=Math.max(1200,Math.round(r*3.4)),k=pe/(pe-r*Math.cos(.14)),
  sc=Math.min(1,(innerWidth-16)/Math.max(2*r+20,w*1.35*k));
  const lg=`<img src="${BACKLOGO}" alt="CodeHost logo">`;
  el.style.perspective=pe+'px';el.style.height=Math.ceil((h*k+2*r*Math.sin(.14)*k+60)*sc)+'px';
  el.innerHTML=`<div class="sc" style="transform:rotateX(-8deg) scale(${sc})"><div class="ring ${cls}" style="--w:${w}px;--h:${h}px;animation-duration:${n*5+14}s">`+items.map((x,i)=>
    `<div class="card ${cls}" style="--c:hsl(${Math.round(i*360/n+40)} 85% 62%);transform:rotateY(${i*360/n}deg) translateZ(${r}px)"><div class="front"><img src="${esc(x.img||FALLBACK)}" alt="${esc(x.t)}"><div class="info"><b>${esc(x.t)}</b>`+
    (P?`<span class="role">${esc(x.s)}</span><a class="view" href="#profile-${x.id}">View</a>`:'')+`</div></div><div class="bk">${lg}</div></div>`).join('')+'</div></div>';
}

async function loadSite(){
  const [s,p,v,l]=await Promise.all([
    sb.from('settings').select().eq('id',1).maybeSingle(),
    sb.from('people').select().order('sort'),
    sb.from('services').select().order('sort'),
    sb.from('links').select().order('sort')]);
  const c=s.data||{}, people=p.data||[];LOGO=c.logo_url||'';
  if(c.logo_url){$('#logo').src=c.logo_url;$('#logo').hidden=false}
  $('#ht').textContent=c.hero_title||'CodeHost Info';
  $('#hp').textContent=c.hero_text||'';
  $('#addr').textContent=c.address||'Mymensingh, Bangladesh';
  $('#map').src=c.map_url||'https://maps.google.com/maps?q=Mymensingh,Bangladesh&z=12&output=embed';
  $('#wa').href='https://wa.me/'+(c.whatsapp||'8801810875771');
  const m=x=>({id:x.id,img:x.photo_url,t:x.name,s:x.role});
  ring($('#r1'),people.filter(x=>x.kind==='founder').map(m),'p');
  ring($('#r2'),people.filter(x=>x.kind!=='founder').map(m),'p');
  ring($('#r3'),(v.data||[]).map(x=>({img:x.icon_url,t:x.title,s:''})),'svc');
  $('#links').innerHTML=(l.data||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`).join('');
}

/* ---------- Profile page ---------- */
async function showProfile(id){
  const P=$('#profile');P.innerHTML='<p class="pad">Loading...</p>';
  const {data:x}=await sb.from('people').select().eq('id',id).maybeSingle();
  if(!x){P.innerHTML='<p class="pad">Profile not found. <a class="back" href="#">Back</a></p>';return}
  let more='';
  if(x.kind!=='founder'){
    const tools=(x.tools||'').split(',').map(t=>t.trim()).filter(Boolean);
    let dur='Not added',days='-',jd='-';
    if(x.joined){const j=new Date(x.joined),n=new Date();let m=(n.getFullYear()-j.getFullYear())*12+n.getMonth()-j.getMonth();if(n.getDate()<j.getDate())m--;m=Math.max(m,0);
      const y=Math.floor(m/12),mo=m%12;dur=(y?y+(y>1?' years ':' year '):'')+mo+(mo===1?' month':' months');
      days=Math.max(Math.floor((n-j)/864e5),0).toLocaleString();jd=j.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
    more=(x.joined?`<h2>Time with us</h2><ol class="nl"><li><span>Working with us for</span><b>${dur}</b></li><li><span>Total days</span><b>${days}</b></li><li><span>Joined on</span><b>${jd}</b></li></ol>`:'')+(tools.length?`<h2>Tools &amp; technologies</h2><ol class="nl">${tools.map(t=>`<li><b>${esc(t)}</b></li>`).join('')}</ol>`:'')}
  P.innerHTML=`<header><a class="back" href="#">&larr; Back</a><span class="brand">CodeHost Info</span></header>
  <div class="pf"><img src="${esc(x.photo_url||FALLBACK)}" alt="${esc(x.name)}"><div><h1>${esc(x.name)}</h1><span class="role">${esc(x.role)}</span></div></div>${more}<div style="height:90px"></div>`;
  scrollTo(0,0);
}

/* ---------- Admin (open with  yoursite/#admin ) ---------- */
let busy=false,editId=null;
const up=async f=>{const n=Date.now()+'_'+f.name.replace(/[^\w.-]/g,'_');const {error}=await sb.storage.from('media').upload(n,f,{upsert:true,contentType:f.type});if(error)throw new Error('Image upload failed: '+error.message);return sb.storage.from('media').getPublicUrl(n).data.publicUrl};
const fileOf=id=>$('#'+id).files[0];
function toast(m,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
const lock=on=>document.querySelectorAll('#admin button').forEach(b=>b.disabled=on);
const run=async(fn,msg='Saved')=>{
  if(busy)return;busy=true;lock(true);
  try{const {data:{session}}=await sb.auth.getSession();
    if(!session){toast('Session expired. Please log in again.',1);await adminView();return}
    await fn();editId=null;toast(msg+' \u2713');await adminView();loadSite()}
  catch(e){toast(e.message,1)}
  finally{busy=false;lock(false)}};

async function adminView(){
  const A=$('#admin'),{data:{session}}=await sb.auth.getSession();
  if(!session){A.innerHTML=`<div class="abar"><h2>Admin Login</h2><button class="sec" onclick="location.hash=''">Back to site</button></div><div class="box"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button onclick="login()">Login</button></div>`;return}
  const [s,p,v,l]=await Promise.all([sb.from('settings').select().eq('id',1).maybeSingle(),sb.from('people').select().order('sort'),sb.from('services').select().order('sort'),sb.from('links').select().order('sort')]);
  const c=s.data||{};window.PEOPLE=p.data||[];
  const rows=(t,arr,img,a,b)=>arr.map(x=>`<div class="row"><span style="display:flex;align-items:center;gap:10px">${img?`<img src="${esc(x[img]||FALLBACK)}" alt="">`:''}<b>${esc(x[a])}</b><small style="color:var(--m)">${esc(x[b]||'')}</small></span><span>${t==='people'?`<button class="sec" onclick="editP(${x.id})">Edit</button>`:''}<button class="del" onclick="del('${t}',${x.id})">Delete</button></span></div>`).join('')||'<p style="color:var(--m);padding:8px">Nothing added yet.</p>';
  const people=p.data||[];
  A.innerHTML=`<div class="abar"><h2>Admin Panel</h2><button class="sec" onclick="location.hash=''">Back to site</button><button class="sec" onclick="sb.auth.signOut().then(adminView)">Logout</button></div>
  <div class="ah">Settings</div><div class="box">
   <input id="s_ht" placeholder="Hero title" value="${esc(c.hero_title)}" style="width:100%"><input id="s_hp" placeholder="Hero text" value="${esc(c.hero_text)}" style="width:100%">
   <input id="s_ad" placeholder="Address" value="${esc(c.address)}" style="width:100%"><input id="s_mp" placeholder="Google Maps embed URL (leave empty for Mymensingh)" value="${esc(c.map_url)}" style="width:100%">
   <input id="s_wa" placeholder="WhatsApp (8801810875771)" value="${esc(c.whatsapp||'8801810875771')}"><br>Logo: <input id="s_lg" type="file" accept="image/*"><button onclick="saveS()">Save settings</button></div>
  <div class="ah">Founders &amp; Team <span>${people.length}</span></div><div class="box">
   <input id="p_n" placeholder="Name"><input id="p_r" placeholder="Role (e.g. Owner, Designer)">
   <select id="p_k" onchange="kindUI()"><option value="founder">Founder</option><option value="employee">Employee</option></select>
   <div id="p_x"><input id="p_j" type="date" title="Joined on"><small style="color:var(--m)">&larr; Joined date</small><div><input id="p_ti" placeholder="Add a tool, e.g. Figma" onkeydown="if(event.key==='Enter'){event.preventDefault();addTool()}"><button class="sec" onclick="addTool()">+ Add tool</button></div><ol class="al" id="p_tl"></ol></div>
   Photo: <input id="p_f" type="file" accept="image/*"><button id="p_b" onclick="addP()">Add</button>${rows('people',people,'photo_url','name','role')}</div>
  <div class="ah">Services <span>${(v.data||[]).length}</span></div><div class="box"><input id="v_t" placeholder="Service name"> Icon: <input id="v_f" type="file" accept="image/*"><button onclick="addV()">Add service</button>${rows('services',v.data||[],'icon_url','title')}</div>
  <div class="ah">Website Links <span>${(l.data||[]).length}</span></div><div class="box"><input id="l_t" placeholder="Title"><input id="l_u" placeholder="https://..."><button onclick="addL()">Add link</button>${rows('links',l.data||[],null,'title','url')}</div>`;
  toolsArr=[];renderTools();kindUI();
}
let toolsArr=[];
const renderTools=()=>{$('#p_tl').innerHTML=toolsArr.map((t,i)=>`<li>${esc(t)}<button class="del" onclick="rmTool(${i})">x</button></li>`).join('')};
const addTool=()=>{const v=$('#p_ti').value.replace(/,/g,' ').trim();if(!v)return;toolsArr.push(v);$('#p_ti').value='';renderTools();$('#p_ti').focus()};
const rmTool=i=>{toolsArr.splice(i,1);renderTools()};
const kindUI=()=>{$('#p_x').style.display=$('#p_k').value==='founder'?'none':'block'};
async function login(){if(busy)return;busy=true;const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});busy=false;if(error)toast(error.message,1);else adminView()}
const del=(t,id)=>confirm('Delete?')&&run(async()=>{const {error}=await sb.from(t).delete().eq('id',id);if(error)throw error},'Deleted');
const saveS=()=>run(async()=>{const o={id:1,hero_title:$('#s_ht').value,hero_text:$('#s_hp').value,address:$('#s_ad').value,map_url:$('#s_mp').value,whatsapp:$('#s_wa').value};
  if(fileOf('s_lg'))o.logo_url=await up(fileOf('s_lg'));const {error}=await sb.from('settings').upsert(o);if(error)throw error},'Settings saved');
const addP=()=>{const n=$('#p_n').value.trim();if(!n)return toast('Enter a name',1);
  return run(async()=>{const f=fileOf('p_f'),k=$('#p_k').value,emp=k!=='founder',o={name:n,role:$('#p_r').value.trim(),kind:k,joined:emp?($('#p_j').value||null):null,tools:emp?(()=>{const v=$('#p_ti').value.replace(/,/g,' ').trim();return (v?[...toolsArr,v]:toolsArr).join(',')})():null};
    if(f)o.photo_url=await up(f);
    const {error}=await(editId?sb.from('people').update(o).eq('id',editId):sb.from('people').insert({...o,sort:Date.now()%1e9}));if(error)throw error},editId?'Updated':'Added')};
function editP(id){const x=PEOPLE.find(o=>o.id===id);editId=id;$('#p_n').value=x.name||'';$('#p_r').value=x.role||'';$('#p_k').value=x.kind||'employee';$('#p_j').value=x.joined||'';toolsArr=(x.tools||'').split(',').map(t=>t.trim()).filter(Boolean);renderTools();$('#p_b').textContent='Update (photo optional)';kindUI();scrollTo(0,$('#p_n').getBoundingClientRect().top+scrollY-110)}
const addV=()=>{const t=$('#v_t').value.trim();if(!t)return toast('Enter a service name',1);
  return run(async()=>{const f=fileOf('v_f');const {error}=await sb.from('services').insert({title:t,icon_url:f?await up(f):null,sort:Date.now()%1e9});if(error)throw error},'Service added')};
const addL=()=>{const t=$('#l_t').value.trim(),u=$('#l_u').value.trim();if(!t||!u)return toast('Enter title and URL',1);
  return run(async()=>{const {error}=await sb.from('links').insert({title:t,url:u,sort:Date.now()%1e9});if(error)throw error},'Link added')};

let wasAdmin=false;
function route(){const h=location.hash,a=h==='#admin',pr=h.startsWith('#profile-');
  $('#admin').style.display=a?'block':'none';$('#site').style.display=(a||pr)?'none':'block';$('#profile').style.display=pr?'block':'none';$('#wa').style.display=a?'none':'';
  if(a)adminView();else{if(wasAdmin)loadSite();if(pr)showProfile(h.slice(9))}
  wasAdmin=a}
addEventListener('hashchange',route);route();loadSite();
</script>
</body>
